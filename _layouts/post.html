---
layout: default
---
<article>
  <header>
    <h1>{{ page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.date_format }}</time></p>
  </header>
  {{ content }}
  <nav class="post-nav"><a href="{{ "/blog/" | relative_url }}">&larr; All posts</a></nav>
</article>
